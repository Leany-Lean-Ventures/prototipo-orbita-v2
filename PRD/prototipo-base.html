<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novo CRM Ademicon — Protótipo WOW</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<style>
:root{
  --maroon:#C43C30; --maroon-2:#E24A3C; --rust:#ED6151; --froly:#FBA39D;
  --ink:#211A15; --ink-2:#4A3E36; --paper:#F4EFE9; --card:#fff; --line:#E8DFD5; --line-2:#F1E9E0;
  --muted:#857a70; --muted-2:#A89C92;
  --green:#15803D; --amber:#B45309; --red:#B91C1C; --blue:#1D4ED8; --violet:#6D28D9; --cyan:#0E7490;
  --green-bg:#E7F4EC; --amber-bg:#FBF1E0; --red-bg:#FBE9E9; --blue-bg:#E7EDFB; --violet-bg:#F3E8FF; --maroon-bg:#FDF1F0;
  --shadow:0 12px 32px -20px rgba(153,27,27,.32);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5;overflow:hidden}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#d9ccbe;border-radius:6px;border:2px solid var(--paper)}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
.app{display:flex;height:100vh}

/* SIDEBAR */
.side{width:236px;background:linear-gradient(180deg,var(--maroon),#9E2E24);color:#f4e6df;display:flex;flex-direction:column;flex-shrink:0;padding:16px 12px}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px}
.brand .logo{width:38px;height:38px;border-radius:10px;background:#fff;color:var(--maroon);font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center}
.brand b{font-size:15px;font-weight:800;color:#fff;display:block}
.brand small{font-size:11px;color:#F1DED7}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;font-size:13.5px;font-weight:600;color:#F4E7E2;transition:.15s}
.nav a .ic{width:18px;text-align:center;opacity:.9}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.on{background:#fff;color:var(--maroon);box-shadow:var(--shadow)}
.nav a .tagnew{margin-left:auto;font-size:9px;font-weight:800;background:#FFD37A;color:#6b3b00;padding:2px 6px;border-radius:6px;letter-spacing:.04em}
.side .spacer{flex:1}
.side .me{display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid rgba(255,255,255,.12)}
.side .me .av{width:32px;height:32px;border-radius:50%;background:#fff;color:var(--maroon);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:12px}
.side .me b{font-size:12.5px;color:#fff;display:block;line-height:1.2}
.side .me small{font-size:10.5px;color:#F1DED7}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;flex-shrink:0}
.crumb{font-size:13px;color:var(--muted);font-weight:600}.crumb b{color:var(--ink)}
.top .search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:7px 12px;width:240px;color:var(--muted);font-size:12.5px}
.top .demo{margin-left:auto;font-size:11px;font-weight:800;color:var(--amber);background:var(--amber-bg);padding:5px 11px;border-radius:99px}
.top .bell{position:relative;font-size:17px;color:var(--muted)}.top .bell b{position:absolute;top:-5px;right:-6px;background:var(--red);color:#fff;font-size:9px;font-weight:800;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.top .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--maroon-2),var(--froly));color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
.view{flex:1;overflow-y:auto;padding:26px}

/* generic */
.page-h{margin-bottom:20px}
.page-h h1{font-size:25px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.page-h p{color:var(--muted);font-size:14px;margin-top:3px}
.fresh{font-size:11.5px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:4px 11px;border-radius:99px;font-weight:600}
.row{display:flex;gap:16px;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.card h3{font-size:14.5px;font-weight:700;margin-bottom:2px}
.card .csub{font-size:12px;color:var(--muted);margin-bottom:14px}
.grid{display:grid;gap:16px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--rust)}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:9px}
.btn.p{background:var(--maroon-2);color:#fff}.btn.p:hover{background:var(--maroon)}
.btn.s{background:#fff;border:1px solid var(--line);color:var(--ink-2)}.btn.s:hover{border-color:var(--muted-2)}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.p-green{background:var(--green-bg);color:var(--green)}.p-amber{background:var(--amber-bg);color:var(--amber)}.p-red{background:var(--red-bg);color:var(--red)}
.p-blue{background:var(--blue-bg);color:var(--blue)}.p-violet{background:var(--violet-bg);color:var(--violet)}.p-gray{background:#EFEAE4;color:var(--muted)}.p-maroon{background:var(--maroon-bg);color:var(--maroon-2)}
table.t{width:100%;border-collapse:collapse}
table.t th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:10px 12px}
table.t td{padding:11px 12px;border-top:1px solid var(--line);font-size:13.5px}
table.t tbody tr{cursor:pointer}table.t tbody tr:hover td{background:#FCFAF7}
.exec{background:linear-gradient(120deg,var(--maroon-bg),#fff);border:1px solid var(--line);border-left:4px solid var(--rust);border-radius:14px;padding:16px 20px;margin-bottom:18px;display:flex;gap:14px}
.exec .ico{font-size:22px}
.exec .em{color:var(--ink-2);font-size:14px}.exec .em b{color:var(--ink)} .exec .em .r{color:var(--red);font-weight:700} .exec .em .g{color:var(--green);font-weight:700}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.kpi .kt{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.kpi .kl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.kpi .ki{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
.kpi .kn{font-size:27px;font-weight:800;letter-spacing:-.02em}
.kpi .kgoal{font-size:11px;color:var(--muted);margin-top:5px;display:flex;justify-content:space-between}
.kpi .kbar{height:4px;border-radius:3px;background:var(--line-2);margin-top:5px;overflow:hidden}.kpi .kbar i{display:block;height:100%;border-radius:3px}
.kpi.alert{border-color:#F1C9C1;background:#FEF7F5}

/* alerts */
.alerts .a{display:flex;align-items:center;gap:11px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.alerts .a .ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.alerts .a .at{flex:1;font-size:13px;color:var(--ink-2)}
.alerts .a .cn{font-weight:800;font-size:15px}
.alerts .a .go{font-size:11px;font-weight:700;padding:5px 11px;border-radius:7px;background:var(--maroon-2);color:#fff}

/* region health bars */
.rhb{margin-bottom:11px}
.rhb .rl{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}.rhb .rl b{font-weight:700}
.rhb .bar{height:7px;border-radius:4px;background:var(--line-2);overflow:hidden}.rhb .bar i{display:block;height:100%;border-radius:4px}

/* hbar */
.hb{margin-bottom:10px}.hb .hl{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;color:var(--ink-2)}.hb .hl b{color:var(--ink)}
.hb .bar{height:6px;border-radius:4px;background:var(--line-2);overflow:hidden}.hb .bar i{display:block;height:100%;border-radius:4px}

/* occurrences feed */
.occ{display:flex;gap:11px;padding:11px;border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:10px;margin-bottom:9px}
.occ .ot{flex:1}.occ .ott{font-weight:700;font-size:13px}.occ .od{font-size:12px;color:var(--muted);margin-top:2px}.occ .meta{font-size:11px;color:var(--muted-2);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs button{padding:10px 16px;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;border-radius:8px 8px 0 0}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--maroon-2);border-bottom-color:var(--maroon-2);font-weight:700}

/* unit header */
.uhead{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.uhead .top2{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.uhead h1{font-size:24px;font-weight:800;display:flex;align-items:center;gap:12px}
.uhead .facts{display:flex;gap:30px;margin-top:14px;flex-wrap:wrap}
.uhead .facts .f .fl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.uhead .facts .f .fv{font-size:14px;font-weight:600;margin-top:2px;display:flex;align-items:center;gap:6px}
.uhead .actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.donut-wrap{text-align:center;flex-shrink:0}.donut-wrap .dl{font-size:11px;color:var(--muted);margin-top:4px}

/* societaria / equipe */
.soc{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line-2)}
.soc:first-child{border-top:none}
.soc .si{width:36px;height:36px;border-radius:9px;background:var(--green-bg);display:flex;align-items:center;justify-content:center;font-size:17px}
.soc .sn{flex:1}.soc .snn{font-weight:700;font-size:13.5px}.soc .snc{font-size:11.5px;color:var(--muted)}
.tree .tn{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line-2)}
.tree .tn:first-child{border-top:none}
.tree .av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.tree .nn{flex:1}.tree .nnn{font-weight:700;font-size:13px}.tree .nnm{font-size:11px;color:var(--muted)}
.tree .branch{color:#cdbcab;margin-right:-4px}

/* commission cascade */
.casc{display:flex;align-items:stretch;gap:8px;margin-top:6px}
.casc .seg{flex:1;text-align:center;border-radius:9px;padding:11px 8px;color:#fff}
.casc .seg .sp{font-size:19px;font-weight:800}.casc .seg .sl{font-size:10.5px;opacity:.9;margin-top:2px}.casc .seg .sq{font-size:11px;font-weight:800;margin-top:6px;background:rgba(255,255,255,.22);border-radius:6px;padding:2px 0}

/* timeline (filme) */
.tl{position:relative;padding-left:30px}
.tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tlitem{position:relative;margin-bottom:16px}
.tlitem .node{position:absolute;left:-29px;top:0;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;border:2px solid #fff;box-shadow:0 0 0 2px var(--line)}
.tlitem .box{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 14px}
.tlitem .bh{display:flex;justify-content:space-between;align-items:center}.tlitem .bt{font-weight:700;font-size:13.5px}.tlitem .bd{font-size:11.5px;font-weight:700;color:var(--muted)}
.tlitem .bx{font-size:12.5px;color:var(--ink-2);margin-top:4px}

/* graph */
.gcanvas{position:relative;background:#FBF8F5;border:1px solid var(--line);border-radius:12px;overflow:hidden;height:520px}
.gpanel{position:absolute;top:14px;right:14px;width:230px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.gpanel .gt{font-weight:800;font-size:15px}.gpanel .gs{color:var(--muted);font-size:12px;margin-bottom:10px}
.gpanel .gr{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line-2);font-size:12.5px}.gpanel .gr b{font-weight:700}
.gpanel .conn{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-2);margin:12px 0 6px}
.gpanel .ce{display:flex;align-items:center;gap:7px;padding:6px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;cursor:pointer;font-size:12px}.gpanel .ce:hover{border-color:var(--maroon-2)}
.gpanel .ce .cd{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.gfilters{position:absolute;top:14px;left:14px;display:flex;gap:6px;flex-wrap:wrap}
.gfilters button{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:8px;background:#fff;border:1px solid var(--line);color:var(--muted)}
.gfilters button.on{background:var(--maroon-bg);border-color:var(--maroon-2);color:var(--maroon-2)}
.glegend{position:absolute;bottom:14px;left:14px;display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 13px;font-size:11.5px}
.glegend span{display:flex;align-items:center;gap:6px;color:var(--ink-2)}.glegend i{width:10px;height:10px;border-radius:3px}
.gnode{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.gnode:hover{transform:scale(1.14)}
.gnode text{font-size:9px;font-weight:600;pointer-events:none}
.gring{transform-box:fill-box;transform-origin:center}
.gcanvas svg{display:block}
/* treemap */
.tmwrap{display:flex;gap:6px;height:520px;background:#FBF8F5;border:1px solid var(--line);border-radius:12px;padding:10px}
.tmcol{display:flex;flex-direction:column;gap:5px;min-width:0}
.tmhead{font-size:11.5px;font-weight:800;color:#fff;border-radius:7px;padding:7px 9px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.tmcell{border-radius:7px;padding:8px 9px;color:#fff;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;min-height:0;cursor:pointer;transition:filter .15s}
.tmcell:hover{filter:brightness(1.1)}
.tmcell .tn2{font-size:11.5px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmcell .tv2{font-size:10px;opacity:.85}
/* sunburst */
.sbseg{cursor:pointer;transition:opacity .15s}.sbseg:hover{opacity:.82}
/* hierarquia */
.hrow{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;border-top:1px solid var(--line-2);font-size:13.5px}
.hrow:first-child{border-top:none}

/* kanban */
.kanwrap{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:start}
.kcol{background:#F7F2ED;border:1px solid var(--line);border-radius:12px;padding:10px}
.kchead{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;padding-bottom:8px;margin-bottom:9px;border-bottom:2px solid}
.kchead .ct{font-size:11px;background:#fff;border-radius:99px;padding:1px 8px;color:var(--muted)}
.kcard2{background:#fff;border:1px solid var(--line);border-top:2px solid;border-radius:9px;padding:11px;margin-bottom:8px;box-shadow:0 4px 10px -8px rgba(0,0,0,.3)}
.kcard2 .kn2{font-weight:700;font-size:13px}
.kcard2 .kl2{font-size:11px;color:var(--muted);margin:3px 0 7px}
.kcard2 .kf{display:flex;justify-content:space-between;align-items:center}
.kcard2 .ka{font-size:10.5px;color:var(--muted-2)}
.kpi-mini{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.kpi-mini .m{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 16px;box-shadow:var(--shadow)}
.kpi-mini .m .mn{font-size:21px;font-weight:800}.kpi-mini .m .ml{font-size:11px;color:var(--muted)}

/* segmented */
.seg-ctrl{display:inline-flex;background:#F0EAE3;border-radius:9px;padding:3px}
.seg-ctrl button{font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:7px;color:var(--muted)}
.seg-ctrl button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px -3px rgba(0,0,0,.3)}
.banner{display:flex;align-items:center;gap:11px;background:#FEF7F5;border:1px solid #F1C9C1;border-radius:11px;padding:11px 14px;margin-bottom:14px;font-size:13px;color:var(--ink-2)}
.banner b{color:var(--red)}
.emptybox{padding:40px;text-align:center;color:var(--muted-2);border:1px dashed var(--line);border-radius:12px}
.chiprow{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.chip{font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px;background:#fff;border:1px solid var(--line);color:var(--muted)}
.chip.on{background:var(--maroon-2);color:#fff;border-color:var(--maroon-2)}

/* ===== v2 modules ===== */
.nav{overflow-y:auto;min-height:0}
.nav::-webkit-scrollbar{width:6px}.nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2)}
.nav a{padding:9px 12px}
.pcard{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line-2)}
.pcard:first-of-type{border-top:none}
.pcard .pi{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.steps{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.steps .dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex-shrink:0}
.steps .dot.done{background:var(--maroon-2)}
.steps .dot.cur{box-shadow:0 0 0 3px var(--maroon-bg)}
.steps .stept{font-size:11px;color:var(--muted);margin-left:6px}
.chk{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px solid var(--line-2);font-size:13px;color:var(--muted)}
.chk:first-of-type{border-top:none}
.chk .ck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--muted-2);flex-shrink:0}
.chk.ok{color:var(--ink-2)}
.chk.ok .ck{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.pnl{padding:12px;border:1px solid var(--line);border-radius:11px;margin-bottom:10px;background:#FCFAF7}
.mtr{height:8px;border-radius:5px;background:var(--line-2);overflow:hidden}.mtr i{display:block;height:100%;border-radius:5px}
.sw{width:36px;height:20px;border-radius:99px;background:var(--line);position:relative;flex-shrink:0;transition:.15s;cursor:pointer}
.sw i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.15s}
.sw.on{background:var(--green)}.sw.on i{left:18px}

/* ===== growth chart (interativo) ===== */
.gchart{width:100%;height:auto;display:block;overflow:visible}
.hcol .rev{opacity:0;transition:opacity .12s;pointer-events:none}
.hcol:hover .rev{opacity:1}
.gchart circle{pointer-events:none}
.cht{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 26px -12px rgba(70,14,0,.45);padding:9px 12px;font-family:inherit;line-height:1.35}
.cht .chm{font-weight:800;color:var(--ink);font-size:12.5px;margin-bottom:4px}
.cht .chr{font-size:12px;font-weight:600;margin-top:1px}.cht .chr b{font-weight:800}
.glg{display:flex;gap:22px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.glg span{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);font-weight:600}
.glg i{width:11px;height:11px;border-radius:50%}

/* ===== mapa de status por região ===== */
.regmap{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.rcard{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;display:block;width:100%;transition:.15s}
.rcard:hover{border-color:var(--maroon-2);box-shadow:var(--shadow);transform:translateY(-2px)}
.rcard .rn2{font-size:13px;font-weight:700;color:var(--ink)}
.rcard .rdot{width:11px;height:11px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px rgba(0,0,0,.05)}
.rcard .rnum{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:1px 0 4px}
.rcard.wide{grid-column:1 / -1}
.spk{width:100%;height:34px;display:block}

/* ===== distribuição por status ===== */
.distchart{position:relative;margin-top:10px;padding-bottom:2px}
.dgrid{position:absolute;left:212px;right:66px;top:6px;bottom:26px;display:flex;justify-content:space-between;pointer-events:none;z-index:0}
.dgrid i{width:1px;background:var(--line-2);display:block}
.distrow{position:relative;z-index:1;display:grid;grid-template-columns:200px 1fr 54px;align-items:center;gap:12px;width:100%;text-align:left;background:none;padding:8px 0;cursor:pointer}
.distrow:hover{background:rgba(158,43,18,.03);border-radius:8px}
.dlabel{display:flex;align-items:center;justify-content:flex-end;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-2);text-align:right;line-height:1.2}
.dtick{width:10px;height:3px;border-radius:2px;flex-shrink:0}
.dtrack{position:relative;height:16px;background:#E5DBCF;border-radius:8px}
.dbar{position:absolute;left:0;top:0;height:100%;border-radius:8px;transition:filter .15s,transform .15s;transform-origin:left;min-width:8px}
.distrow:hover .dbar{filter:brightness(1.1)}
.dmark{position:absolute;right:-4px;top:50%;width:14px;height:14px;border-radius:50%;transform:translateY(-50%) scale(.7);border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35);transition:transform .15s}
.distrow:hover .dmark{transform:translateY(-50%) scale(1.05)}
.dval{font-size:13px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.dtip{position:absolute;bottom:24px;transform:translateX(-50%);background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 14px 30px -12px rgba(70,14,0,.5);padding:10px 13px;white-space:nowrap;opacity:0;visibility:hidden;transition:.15s;pointer-events:none;z-index:8}
.dtip>b{font-size:13px;font-weight:800;color:var(--ink)}
.dtip .dtq{display:block;font-size:12px;color:var(--muted);margin-top:4px;font-weight:600}
.dtip .dtq b{color:var(--ink);font-weight:800}
.distrow:hover .dtip{opacity:1;visibility:visible}
.daxis{display:grid;grid-template-columns:200px 1fr 54px;gap:12px;margin-top:6px}
.daxis .ax{grid-column:2;display:flex;justify-content:space-between;font-size:11px;color:var(--muted-2);font-variant-numeric:tabular-nums}

/* ===== rede: split layout + macro + selection ===== */
.rede-split{display:grid;grid-template-columns:1fr 252px;gap:16px;align-items:start}
.gpanel-static{position:static;width:auto;max-height:540px;overflow-y:auto}
.gphint{font-size:12px;color:var(--muted);line-height:1.45}
.tmsel{outline:3px solid #fff;outline-offset:-3px;box-shadow:0 0 0 3px var(--maroon-2),0 8px 20px -8px rgba(0,0,0,.4);z-index:2}
.gpbtn{width:100%;margin-top:10px;justify-content:center}

/* ===== rede: seleção dinâmica ===== */
.gnode{transition:transform .2s cubic-bezier(.34,1.56,.64,1),opacity .28s}
.gedge{transition:opacity .28s,stroke-width .28s}
.gempty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;color:var(--muted);font-size:12.5px;line-height:1.5;padding:26px 4px}
.gemptyic{font-size:34px;opacity:.5}

/* ===== busca de unidades ===== */

.usearch input::placeholder{color:var(--muted-2)}
.usearch .ushint{font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap}

/* ===== composição clicável ===== */
.soclink{cursor:pointer;border-radius:9px;transition:background .15s;margin:0 -8px;padding-left:8px;padding-right:8px}
.soclink:hover{background:var(--paper)}
.socchev{color:var(--muted-2);font-weight:700;margin-left:2px}

/* ===== modal ===== */

.modal-body{padding:16px 20px;overflow-y:auto;flex:1;min-height:0}

function polar(cx,cy,r,deg){const a=(deg-90)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}
function arcD(cx,cy,r0,r1,a0,a1){const large=(a1-a0)>180?1:0;const[x0,y0]=polar(cx,cy,r1,a0),[x1,y1]=polar(cx,cy,r1,a1),[x2,y2]=polar(cx,cy,r0,a1),[x3,y3]=polar(cx,cy,r0,a0);return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r1} ${r1} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} L${x2.toFixed(2)} ${y2.toFixed(2)} A${r0} ${r0} 0 ${large} 0 ${x3.toFixed(2)} ${y3.toFixed(2)} Z`;}

function donut(pct,grade,color,size){size=size||90;const r=32,c=2*Math.PI*r;return `<svg width="${size}" height="${size}" viewBox="0 0 80 80"><circle cx="40" cy="40" r="${r}" fill="none" stroke="var(--line-2)" stroke-width="8"/><circle cx="40" cy="40" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct/100)}" transform="rotate(-90 40 40)"/><text x="40" y="37" text-anchor="middle" font-size="22" font-weight="800" fill="${color}">${grade}</text><text x="40" y="52" text-anchor="middle" font-size="9" fill="var(--muted)">${pct}/100</text></svg>`;}
function areaChart(data,series){ // series:[{key,color,label}]
 const W=560,H=180,PL=34,PR=58,PT=12,PB=24;
 const vals=data.flatMap(d=>series.map(s=>d[s.key]));
 const mn=Math.min(...vals)*.9,mx=Math.max(...vals)*1.05;
 const xs=i=>PL+i*(W-PL-PR)/(data.length-1), ys=v=>PT+(H-PT-PB)*(1-(v-mn)/(mx-mn));
 let g="";[0,.33,.66,1].forEach(f=>{const y=PT+(H-PT-PB)*f;g+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="var(--line-2)"/>`;});
 let paths="",labels="",dots="";
 series.forEach(s=>{
   const d=data.map((p,i)=>(i?"L":"M")+xs(i).toFixed(1)+","+ys(p[s.key]).toFixed(1)).join(" ");
   const area=d+` L${xs(data.length-1)},${H-PB} L${PL},${H-PB} Z`;
   paths+=`<path d="${area}" fill="${s.color}" opacity="0.07"/><path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linecap="round"/>`;
   const last=data[data.length-1][s.key];
   labels+=`<text x="${W-PR+6}" y="${ys(last)+3}" font-size="10" font-weight="700" fill="${s.color}">${s.label}</text>`;
   dots+=`<circle cx="${xs(data.length-1)}" cy="${ys(last)}" r="3" fill="${s.color}"/>`;
 });
 let xlab=data.map((p,i)=>`<text x="${xs(i)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--muted-2)">${p.m}</text>`).join("");
 return `<svg width="100%" viewBox="0 0 ${W} ${H}">${g}${paths}${dots}${labels}${xlab}</svg>`;
}
function growthChart(data){
 const W=700,H=360,PL=44,PR=20,PT=20,PB=40,yMax=320;
 const n=data.length;
 const S=[{key:"l",color:"#2563EB",grad:"gL",label:"Unidades"},{key:"li",color:"#16A34A",grad:"gLi",label:"Licenciados"},{key:"au",color:"#E0892B",grad:"gAu",label:"Autorizados"}];
 const xs=i=>PL+i*(W-PL-PR)/(n-1), ys=v=>PT+(H-PT-PB)*(1-v/yMax), y0=ys(0);
 // gridlines + y labels
 let grid="";[0,80,160,240,320].forEach(v=>{const y=ys(v);grid+=`<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="var(--line-2)"/><text x="${PL-10}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted-2)">${v}</text>`;});
 // defs (gradients)
 const defs=`<defs>${S.map(s=>`<linearGradient id="${s.grad}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity="0.30"/><stop offset="1" stop-color="${s.color}" stop-opacity="0.02"/></linearGradient>`).join("")}</defs>`;
 // areas + lines + static markers
 let areas="",lines="",dots="";
 S.forEach(s=>{
   const line=data.map((p,i)=>(i?"L":"M")+xs(i).toFixed(1)+","+ys(p[s.key]).toFixed(1)).join(" ");
   areas+=`<path d="${line} L${xs(n-1).toFixed(1)},${y0.toFixed(1)} L${xs(0).toFixed(1)},${y0.toFixed(1)} Z" fill="url(#${s.grad})"/>`;
   lines+=`<path d="${line}" fill="none" stroke="${s.color}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`;
   dots+=data.map((p,i)=>`<circle cx="${xs(i).toFixed(1)}" cy="${ys(p[s.key]).toFixed(1)}" r="2.6" fill="#fff" stroke="${s.color}" stroke-width="1.6"/>`).join("");
 });
 // x labels
 const xlab=data.map((p,i)=>`<text x="${xs(i).toFixed(1)}" y="${H-14}" text-anchor="middle" font-size="11" fill="var(--muted-2)">${p.m}</text>`).join("");
 // hover columns: vertical guide + highlighted dots + tooltip
 const bw=(W-PL-PR)/(n-1);
 let hov="";
 data.forEach((p,i)=>{
   const px=xs(i);
   const flip=i> n-4; const tw=140, th=26+S.length*20;
   const tx=flip? px-tw-12 : px+12, ty=PT+10;
   const bigdots=S.map(s=>`<circle cx="${px.toFixed(1)}" cy="${ys(p[s.key]).toFixed(1)}" r="5.2" fill="${s.color}" stroke="#fff" stroke-width="2"/>`).join("");
   const rows=S.map(s=>`<div class="chr" style="color:${s.color}">${s.label}: <b>${p[s.key]}</b></div>`).join("");
   const tip=`<foreignObject x="${tx.toFixed(1)}" y="${ty}" width="${tw}" height="${th+4}"><div xmlns="http://www.w3.org/1999/xhtml" class="cht"><div class="chm">${p.m}</div>${rows}</div></foreignObject>`;
   hov+=`<g class="hcol"><rect x="${(px-bw/2).toFixed(1)}" y="${PT}" width="${bw.toFixed(1)}" height="${(H-PT-PB).toFixed(1)}" fill="#fff" fill-opacity="0"/><g class="rev"><line x1="${px.toFixed(1)}" y1="${PT}" x2="${px.toFixed(1)}" y2="${(H-PB).toFixed(1)}" stroke="var(--muted-2)" stroke-width="1"/>${bigdots}${tip}</g></g>`;
 });

function perfChart(data){
 const W=560,H=210,PL=44,PR=16,PT=16,PB=32,color="#E24A3C";
 const vals=data.map(d=>d.v),mn=Math.min(...vals)*0.9,mx=Math.max(...vals)*1.05;
 const xs=i=>PL+i*(W-PL-PR)/(data.length-1), ys=v=>PT+(H-PT-PB)*(1-(v-mn)/(mx-mn)), y0=H-PB;
 let grid="";[0,0.33,0.66,1].forEach(fr=>{const y=(PT+(H-PT-PB)*fr).toFixed(1);grid+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="var(--line-2)"/>`;});
 const lp=data.map((p,i)=>(i?"L":"M")+xs(i).toFixed(1)+","+ys(p.v).toFixed(1)).join(" ");
 const area=lp+` L${xs(data.length-1).toFixed(1)},${y0} L${xs(0).toFixed(1)},${y0} Z`;
 const dots=data.map((p,i)=>`<circle cx="${xs(i).toFixed(1)}" cy="${ys(p.v).toFixed(1)}" r="2.6" fill="#fff" stroke="${color}" stroke-width="1.6"/>`).join("");
 const xlab=data.map((p,i)=>`<text x="${xs(i).toFixed(1)}" y="${H-11}" text-anchor="middle" font-size="10" fill="var(--muted-2)">${p.m}</text>`).join("");
 const bw=(W-PL-PR)/(data.length-1);
 let hov="";
 data.forEach((p,i)=>{const px=xs(i);const prev=i?data[i-1].v:p.v;const dd=prev?((p.v-prev)/prev*100):0;const dtxt=(dd>=0?"+":"")+dd.toFixed(1).replace(".",",")+"%";const dcol=dd>=0?"var(--green)":"var(--red)";const flip=i>data.length-4;const tw=154;const tx=(flip?px-tw-10:px+10).toFixed(1);
   hov+=`<g class="hcol"><rect x="${(px-bw/2).toFixed(1)}" y="${PT}" width="${bw.toFixed(1)}" height="${(H-PT-PB).toFixed(1)}" fill="#fff" fill-opacity="0"/><g class="rev"><line x1="${px.toFixed(1)}" y1="${PT}" x2="${px.toFixed(1)}" y2="${y0}" stroke="var(--muted-2)" stroke-width="1"/><circle cx="${px.toFixed(1)}" cy="${ys(p.v).toFixed(1)}" r="5" fill="${color}" stroke="#fff" stroke-width="2"/><foreignObject x="${tx}" y="${PT+4}" width="${tw}" height="96"><div xmlns="http://www.w3.org/1999/xhtml" class="cht"><div class="chm">${p.m}</div><div class="chr" style="color:${color}">Vendas: <b>R$ ${p.v} mil</b></div><div class="chr" style="color:var(--blue)">Qtd. vendas: <b>${p.q}</b></div><div class="chr" style="color:${dcol}">Evolução: <b>${dtxt}</b></div></div></foreignObject></g></g>`;});
 return `<svg class="gchart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="gPerf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity="0.28"/><stop offset="1" stop-color="${color}" stop-opacity="0.02"/></linearGradient></defs>${grid}<path d="${area}" fill="url(#gPerf)"/><path d="${lp}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>${dots}${xlab}${hov}</svg>`;
}

 let edges=GEDGES.map(e=>{const a=GNODES.find(n=>n.id===e.f),b=GNODES.find(n=>n.id===e.t);const on=f==="todos"?(conn(a.id)&&conn(b.id)):(a.t===f||b.t===f);const soc=a.t==="cnpj"&&b.t==="cpf";return `<line class="gedge" data-a="${a.id}" data-b="${b.id}" data-soc="${soc?1:0}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${GC[a.t]}" stroke-width="${on?2:1}" opacity="${on?(f==="todos"?.5:.3):.06}" ${soc?'stroke-dasharray="5 3"':''}/>`;}).join("");
 let nodes=GNODES.map(n=>{const ok=nodeOn(n),isS=n.id===sel&&ok;const op=ok?1:.1;const c=GC[n.t];
   let shape;
   if(n.t==="macro"){const w=n.r*2.7,h=n.r*1.5;shape=`<rect x="${(n.x-w/2).toFixed(1)}" y="${(n.y-h/2).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="9" fill="${c}22" stroke="${c}" stroke-width="${isS?3:2}"/>`;}
   else if(n.t==="loja"){shape=`<polygon points="${[0,1,2,3,4,5].map(k=>{const a=(k*60-90)*Math.PI/180;return (n.x+n.r*Math.cos(a)).toFixed(1)+","+(n.y+n.r*Math.sin(a)).toFixed(1);}).join(" ")}" fill="${c}1f" stroke="${c}" stroke-width="${isS?3:1.8}"/>`;}

   return `<g class="gnode" data-sel="${n.id}" opacity="${op}">${ring}${shape}${label}</g>`;}).join("");
 const VIEWS=[["grafo","Grafo"],["sunburst","Sunburst"],["treemap","Treemap"],["hierarquia","Hierarquia"],["tabela","Tabela"]];

function SunburstView(sel){

 const active=id=> !sel || id.indexOf(sel)===0 || sel.indexOf(id)===0;

   segs+=`<path class="sbseg" data-sb="${g.id}" data-op="${op}" opacity="${op}" d="${arcD(cx,cy,R[1],R[2],ga0,ga1)}" fill="${g.c}" stroke="#fff" stroke-width="2"><title>${g.name} · ${g.tot} unid.</title></path>`;
   lab((R[1]+R[2])/2,ga0,ga1,g.name,12,14,on);
   let ua=ga0;
   g.units.forEach((x,ui)=>{ const uid=g.id+"-u"+ui; const ua0=ua,ua1=ua+x.u.v/total*360; const uon=active(uid); const uop=uon?0.95:0.12;
     segs+=`<path class="sbseg" data-sb="${uid}" data-op="${uop}" opacity="${uop}" d="${arcD(cx,cy,R[2],R[3],ua0,ua1)}" fill="${rcol(x.u.r)}" stroke="#fff" stroke-width="1"><title>${x.u.n} · ${x.regional} · rating ${x.u.r} (${rgrade(x.u.r)})</title></path>`;

function visLoja(n){return LOJAS.find(x=>x.nome===n);}

LOJAS.forEach(l=>{const macro=MACRO[l.regiao]||l.regiao;const p=(l.cidade||"/").split("/");const cid=(p[0]||"").trim();const uf=(p[1]||"").trim();LOJAGEO[macro]=LOJAGEO[macro]||{};LOJAGEO[macro][uf]=LOJAGEO[macro][uf]||{};LOJAGEO[macro][uf][cid]=LOJAGEO[macro][uf][cid]||[];if(LOJAGEO[macro][uf][cid].indexOf(l.nome)<0)LOJAGEO[macro][uf][cid].push(l.nome);});
function vEstadosOf(reg){if(!reg||reg==="Todas")return [];return Object.keys(LOJAGEO[reg]||{}).sort((a,b)=>a.localeCompare(b,"pt"));}
function vCidadesOf(reg,uf){if(!reg||reg==="Todas"||!uf)return [];return Object.keys((LOJAGEO[reg]||{})[uf]||{}).sort((a,b)=>a.localeCompare(b,"pt"));}
function vUnidadesOf(reg,uf,cid){if(!reg||reg==="Todas"||!uf||!cid)return [];return (((LOJAGEO[reg]||{})[uf]||{})[cid]||[]).slice().sort((a,b)=>a.localeCompare(b,"pt"));}
function visMatch(nome){
 const reg=selVal("vfilRegional"),uf=selVal("vfilEstado"),cid=selVal("vfilCidade"),un=selVal("vfilUnidade");
 if(!un&&!cid&&!uf&&(!reg||reg==="Todas"))return true;

 const lmacro=MACRO[l.regiao]||l.regiao; const p=(l.cidade||"/").split("/"); const lcid=(p[0]||"").trim(); const luf=(p[1]||"").trim();
 if(un)return nome===un;

 if(uf)return luf===uf;
 return lmacro===reg;
}

function parse(){const h=location.hash.replace(/^#\/?/,"")||"dashboard";const [path,qs]=h.split("?");const q=Object.fromEntries(new URLSearchParams(qs||""));const parts=path.split("/");return {path:parts[0],id:parts[1],q};}

 const {path,id,q}=parse();
 // nav
 $("#nav").innerHTML=NAV.map(n=>`<a href="#/${n.id}" title="${n.lbl}" class="${path===n.id||(path==='unidades'&&n.id==='lojas')||((path==='pessoa'||path==='cnpj')&&n.id==='pessoas')||(path==='logbook'&&n.id==='historico')?'on':''}"><span class="ic">${n.ic}</span>${n.lbl}${n.novo?'<span class="tagnew">NOVO</span>':''}</a>`).join("");
 const labels={dashboard:"Dashboard",rede:"Mapa da Rede",lojas:"Unidades",pessoas:"Pessoas & CNPJ",previas:"Prévias",processos:"Processos",penalty:"Comissão & Penalty",carteira:"Carteira",visitas:"Visitas",alertas:"Alertas",blacklist:"Blacklist",historico:"Histórico",logbook:"Histórico",config:"Configurações",unidades:"Unidades",pessoa:"Pessoas & CNPJ",cnpj:"Pessoas & CNPJ"};
 let crumb=`<b>${labels[path]||"Dashboard"}</b>`;
 let html="";
 switch(path){
  case "dashboard":html=Dashboard();break;
  case "rede":html=Rede(q);break;
  case "lojas":html=Lojas(q);break;
  case "unidades":{const u=LOJAS.find(x=>x.id===id)||LOJAS[0];crumb=`Unidades › <b>${u.nome}</b>`;html=Unidade(id,q.tab);break;}
  case "pessoas":html=Pessoas(q);break;

  case "carteira":html=Carteira();break;
  case "visitas":html=Visitas(q);break;

  case "blacklist":html=Blacklist(q);break;
  case "pessoa":{const pp=PESSOAS.find(x=>String(x.id)===String(id))||PESSOAS[0];crumb=`Pessoas & CNPJ › <b>${pp.nome}</b>`;html=PessoaDetalhe(id);break;}

  case "previas":html=Previas();break;

  case "config":html=Config();break;
  default:html=Dashboard();
 }
 $("#crumb").innerHTML="Novo CRM › "+crumb;
 const _bell=document.querySelector(".bell b");if(_bell)_bell.textContent=ALERTAS.length;
 const v=$("#view");v.innerHTML=html;v.scrollTop=0;
 if(path==="rede"){const vw=(q&&q.view)||"grafo";requestAnimationFrame(()=>{if(vw==="sunburst")animateSunburst();else if(vw==="treemap")animateTreemap();else if(vw==="grafo")animateRede();});}
}
function animateRede(){
 const svg=document.getElementById("gsvg"); if(!svg) return;
 const edges=[...svg.querySelectorAll(".gedge")];
 const nodes=[...svg.querySelectorAll(".gnode")];
 const panel=[...document.querySelectorAll(".gpanel .gt,.gpanel .gs,.gpanel .gr,.gpanel .ce,.gpanel .conn,.gpanel .btn")];
 // ESTADO FINAL (sempre aplicado — garante visibilidade mesmo se a animação não rodar)
 const rest=()=>{
   edges.forEach(l=>{l.style.strokeDasharray=l.dataset.soc==="1"?"5 3":"none";l.style.strokeDashoffset="0";});
   nodes.forEach(n=>{n.style.opacity=n.getAttribute("opacity")||"1";n.style.transform="";n.style.transition="";});
   panel.forEach(p=>{p.style.opacity="1";p.style.transform="none";});
 };
 rest();
 if(typeof anime==="undefined"||document.hidden) return; // sem animação: já está visível
 anime.suspendWhenDocumentHidden=false;
 // entrada: arestas se desenham
 edges.forEach(l=>{l.style.strokeDasharray="";});
 anime({targets:edges, strokeDashoffset:[anime.setDashoffset,0], easing:"easeInOutSine", duration:750, delay:anime.stagger(28),
   complete:()=>edges.forEach(l=>{l.style.strokeDasharray=l.dataset.soc==="1"?"5 3":"none";l.style.strokeDashoffset="0";})});
 // entrada: nós com stagger elástico
 nodes.forEach(n=>{n.style.opacity="0";n.style.transition="none";});
 anime({targets:nodes, opacity:el=>parseFloat(el.getAttribute("opacity")||"1"), scale:[0.3,1],
   duration:760, delay:anime.stagger(40,{start:160}), easing:"easeOutElastic(1,.6)", complete:rest});
 // anel: só anima o(s) selecionado(s)
 const activeRings=[...svg.querySelectorAll(".gring")].filter(r=>r.getAttribute("opacity")!=="0");
 if(activeRings.length){anime({targets:activeRings, strokeDashoffset:[0,-28], loop:true, duration:2400, easing:"linear"});anime({targets:activeRings, scale:[1,1.12], opacity:[0.95,0.4], direction:"alternate", loop:true, duration:1300, easing:"easeInOutSine"});}
 // painel lateral desliza
 panel.forEach(p=>{p.style.opacity="0";});
 anime({targets:panel, translateY:[12,0], opacity:[0,1], delay:anime.stagger(45,{start:280}), duration:480, easing:"easeOutQuad", complete:rest});
 setTimeout(rest,2200); // rede de segurança: se a animação travar, reexibe tudo
}
function deselectGraph(svg){
 gCurSel="";
 GNODES.forEach(n=>{const g=svg.querySelector('.gnode[data-sel="'+n.id+'"]');if(!g)return;
   g.style.opacity="1";g.setAttribute("opacity","1");
   const ring=g.querySelector('.gring');if(ring){ring.style.opacity="0";ring.setAttribute("opacity","0");}
   const shape=g.querySelector('polygon,rect,circle:not(.gring)');if(shape){shape.setAttribute("stroke-width", n.t==="macro"?2:(n.t==="loja"?1.8:1.6));}
   const txt=g.querySelector('.gnlabel');if(txt&&n.t!=="macro"){txt.setAttribute("fill","#857a70");txt.setAttribute("font-weight","600");}
 });
 [...svg.querySelectorAll('.gedge')].forEach(l=>{l.style.opacity="0.5";l.setAttribute("stroke-width",2);});
 [...document.querySelectorAll('.gfilters button')].forEach(b=>b.classList.toggle('on', b.dataset.fil==='todos'));
 if(typeof anime!=="undefined")anime.remove([...svg.querySelectorAll('.gring')]);

}

 gCurSel=id;
 const conn=nid=> nid===id||GEDGES.some(e=>(e.f===id&&e.t===nid)||(e.t===id&&e.f===nid));
 GNODES.forEach(n=>{
   const g=svg.querySelector('.gnode[data-sel="'+n.id+'"]'); if(!g) return;
   const ok=conn(n.id), isS=n.id===id;
   g.style.opacity=ok?"1":"0.1"; g.setAttribute("opacity", ok?"1":"0.1");
   const ring=g.querySelector('.gring'); if(ring){ring.style.opacity=isS?"1":"0"; ring.setAttribute("opacity",isS?"1":"0");}
   const shape=g.querySelector('polygon,rect,circle:not(.gring)'); if(shape){shape.setAttribute("stroke-width", isS?3:(n.t==="macro"?2:(n.t==="loja"?1.8:1.6)));}
   const txt=g.querySelector('.gnlabel'); if(txt&&n.t!=="macro"){txt.setAttribute("fill", isS?"#211A15":"#857a70"); txt.setAttribute("font-weight", isS?"700":"600");}
 });
 [...svg.querySelectorAll('.gedge')].forEach(l=>{const on=conn(l.dataset.a)&&conn(l.dataset.b); l.style.opacity=on?"0.5":"0.06"; l.setAttribute("stroke-width", on?2:1);});
 [...document.querySelectorAll('.gfilters button')].forEach(b=>b.classList.toggle('on', b.dataset.fil==='todos'));
 const panel=document.getElementById("gpanel"); if(panel){panel.innerHTML=graphPanel(id); if(typeof anime!=="undefined"){anime({targets:panel.children,translateY:[8,0],opacity:[0,1],delay:anime.stagger(28),duration:320,easing:"easeOutQuad"});}}
 const rings=[...svg.querySelectorAll('.gring')];
 if(typeof anime!=="undefined"){ anime.remove(rings); rings.forEach(r=>{const p=r.closest('.gnode'); r.style.opacity=(p&&p.getAttribute('data-sel')===id)?"1":"0";});
   const sr=svg.querySelector('.gnode[data-sel="'+id+'"] .gring'); if(sr){anime({targets:sr,strokeDashoffset:[0,-28],loop:true,duration:2400,easing:"linear"});anime({targets:sr,scale:[1,1.14],opacity:[1,0.45],direction:"alternate",loop:true,duration:1300,easing:"easeInOutSine"});}
   const gn=svg.querySelector('.gnode[data-sel="'+id+'"]'); if(gn){gn.style.transformBox="fill-box";gn.style.transformOrigin="center";anime({targets:gn,scale:[0.86,1],duration:420,easing:"easeOutBack"});}
 }
 try{history.replaceState(null,"","#/rede?view=grafo&sel="+id);}catch(e){}
}

 const vfilClr=e.target.closest("[data-vfil-clear]");
 if(vfilClr){const ty=vfilClr.dataset.vfilClear;const r=document.getElementById("vfilRegional");if(r)r.value="Todas";fillSelect("vfilEstado",[],"Todos os estados");fillSelect("vfilCidade",[],"Todas as cidades");fillSelect("vfilUnidade",[],"Todas as unidades");const cont=document.getElementById("vtable");if(cont)cont.innerHTML=(ty==="pendentes"?visPendentesTableHtml():visRealizadasTableHtml());return;}
 const ptab=e.target.closest("[data-ptab]");
 if(ptab){const cd=findPrevia(ptab.dataset.prev);if(cd){const tb=document.querySelector(".mtab-body");if(tb)tb.innerHTML=previaTabContent(cd,ptab.dataset.ptab);document.querySelectorAll(".mtabs button").forEach(b=>b.classList.toggle("on",b.dataset.ptab===ptab.dataset.ptab));}return;}
 const prevCard=e.target.closest("[data-prev]");
 if(prevCard){const cd=findPrevia(prevCard.dataset.prev);if(cd)openModal("Dados do Candidato",previaModalBody(cd,"dados"),true);return;}
 const unit=e.target.closest("[data-unit]");
 const tabBtn=e.target.closest("[data-tab]");
 const go=e.target.closest("[data-go]");
 const selNode=e.target.closest("[data-sel]");
 const viewBtn=e.target.closest("[data-view]");
 const regBtn=e.target.closest("[data-regiao]");
 if(regBtn){location.hash=`#/lojas?regiao=${encodeURIComponent(regBtn.dataset.regiao)}`;return;}
 const nivelBtn=e.target.closest("[data-nivel]");
 if(nivelBtn){location.hash=`#/pessoas?nivel=${encodeURIComponent(nivelBtn.dataset.nivel)}`;return;}
 const filBtn=e.target.closest("[data-fil]");
 if(filBtn){location.hash=`#/rede?view=grafo&f=${filBtn.dataset.fil}`;return;}
 const sbEl=e.target.closest("[data-sb]");
 if(sbEl){const val=sbEl.dataset.sb;const cur=(new URLSearchParams((location.hash.split("?")[1]||""))).get("sb")||"";location.hash=(!val||val===cur)?"#/rede?view=sunburst":`#/rede?view=sunburst&sb=${val}`;return;}
 const tmEl=e.target.closest("[data-tm]");
 if(tmEl){location.hash=`#/rede?view=treemap&tm=${tmEl.dataset.tm}`;return;}
 const person=e.target.closest("[data-person]");
 const cnpjEl=e.target.closest("[data-cnpj]");
 if(person){location.hash=`#/pessoa/${person.dataset.person}`;return;}
 if(cnpjEl){location.hash=`#/cnpj/${cnpjEl.dataset.cnpj}`;return;}
 if(viewBtn){location.hash=`#/rede?view=${viewBtn.dataset.view}`;return;}
 if(tabBtn){location.hash=`#/unidades/${tabBtn.dataset.unit}?tab=${tabBtn.dataset.tab}`;return;}
 if(unit){closeModal();location.hash=`#/unidades/${unit.dataset.unit}`;return;}
 if(go){closeSheet();closeModal();location.hash=`#/${go.dataset.go}`;return;}
 if(selNode){selectGraphNode(selNode.dataset.sel);return;}
});
window.addEventListener("hashchange",render);
render();
</script>
